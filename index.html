<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>할 일 하루</title>
</head>
<body>
  <h1>할 일 하루</h1>
  <p>오늘 날짜가 여기에 보입니다</p>

  <div>
    <input type="text" placeholder="할 일을 적어 보세요">
    <button type="button">추가</button>
  </div>

  <p>오늘 할 일을 적어 보세요</p>

  <ul>
    <li>
      <input type="checkbox">
      <span>예시 할 일</span>
      <button type="button">삭제</button>
    </li>
  </ul>

  <p>전체 0개 · 완료 0개</p>
</body>
</html>
